version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      lint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-plugin-*']
      fonts:
        patterns: ['@fontsource/*', '@fontsource-variable/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
